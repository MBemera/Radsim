name: Performance benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "radsim/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9.0.3" "pytest-benchmark>=5.1.0,<6.0"

      - name: Run performance baselines
        run: |
          mkdir -p benchmark-results
          python -m pytest benchmarks -q \
            --benchmark-only \
            --benchmark-json=benchmark-results/baseline.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-baseline-python-3.12
          path: benchmark-results/baseline.json
