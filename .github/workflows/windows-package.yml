name: Windows package smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel and run Windows entry points
        shell: pwsh
        run: |
          python -m venv .windows-smoke
          $wheel = Get-ChildItem .\dist\*.whl | Select-Object -First 1
          .\.windows-smoke\Scripts\python.exe -m pip install $wheel.FullName
          .\.windows-smoke\Scripts\python.exe -m radsim --version
          .\.windows-smoke\Scripts\radsim.exe --version

      - name: Run Windows-focused tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_install_windows.py tests/test_platform_install.py tests/test_tool_shell.py tests/test_jobs_security.py
