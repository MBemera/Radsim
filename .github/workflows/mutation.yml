name: Mutation testing

on:
  pull_request:
    paths:
      - "radsim/**"
      - "tests/**"
      - "scripts/mutation_ci.py"
      - "pyproject.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install mutation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mutation]"

      - name: Run property tests
        run: python -m pytest tests/property -q -p no:randomly

      - name: Select pull request targets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/mutation_ci.py targets \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" > mutation-targets.txt
          sed -n '1,40p' mutation-targets.txt

      - name: Run added Tier 1 mutants
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t targets < mutation-targets.txt
          mutmut run --max-children 4 "${targets[@]}"

      - name: Run complete Tier 1 mutation set
        if: github.event_name != 'pull_request'
        run: mutmut run --max-children 4

      - name: Export and check mutation score
        run: |
          mkdir -p mutation-results
          mutmut export-cicd-stats
          cp mutants/mutmut-cicd-stats.json mutation-results/mutmut-cicd-stats.json

      - name: Require added critical code to hold its mutation score
        if: github.event_name == 'pull_request'
        run: |
          python scripts/mutation_ci.py check \
            mutation-results/mutmut-cicd-stats.json \
            --minimum 0.87

      - name: Enforce complete Tier 1 ratchet
        if: github.event_name != 'pull_request'
        run: |
          python scripts/mutation_ci.py check \
            mutation-results/mutmut-cicd-stats.json \
            --baseline benchmarks/mutation-tier1-baseline.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-results-python-3.12
          path: mutation-results/
          if-no-files-found: ignore
