[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radsimcli"
version = "1.6.2"
description = "RadSim - Radically Simple Code Generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Matthew Bright" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Core runtime dependencies — always required. Feature-specific and unused
# packages were moved to extras (R-09): google-genai had no import or provider
# implementation and was dropped; browser/documents/code-intelligence are
# optional. rich, openai and anthropic stay because the CLI and default
# providers need them.
dependencies = [
    "anthropic>=0.40.0,<1.0",
    "openai>=1.50.0,<2.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.36",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0,<2.0",
]
documents = [
    "pypdf>=4.0.0,<7.0",
]
code-intel = [
    "tree-sitter>=0.21.0,<1.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]
mcp = [
    "mcp>=1.0.0",
]
mutation = [
    "mutmut>=3.7.0,<4.0",
]
profiling = [
    "py-spy>=0.4.2,<0.5",
    "scalene>=2.3.0,<3.0",
]
# Everything a full-featured install needs.
all = [
    "radsimcli[browser,documents,code-intel,mcp]",
]
# pytest >=9.0.3 avoids CVE-2025-71176 (predictable /tmp pytest directory).
dev = [
    "radsimcli[all]",
    "pytest>=9.0.3",
    "pytest-randomly>=3.15.0",
    "pytest-benchmark>=5.1.0,<6.0",
    "pytest-cov>=7.1.0,<8.0",
    "hypothesis>=6.165.10,<7.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
radsim = "radsim.cli:main"

[project.urls]
Homepage = "https://github.com/MBemera/Radsim"
Documentation = "https://github.com/MBemera/Radsim#readme"
PyPI = "https://pypi.org/project/radsimcli/"

[tool.hatch.build.targets.wheel]
packages = ["radsim"]

[tool.hatch.build.targets.sdist]
include = ["radsim/", "docs/", "examples/", "LICENSE", "README.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N806",   # Variable in function should be lowercase (intentional CONSTANT pattern)
    "N818",   # Exception name should end with Error (intentional naming for control flow)
]

[tool.ruff.lint.isort]
known-first-party = ["radsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mutmut]
source_paths = ["radsim"]
also_copy = ["install.py", "scripts"]
only_mutate = [
    "radsim/agent_api.py",
    "radsim/agent_policy.py",
    "radsim/context_budget.py",
    "radsim/learning/retrieval.py",
    "radsim/learning/store.py",
    "radsim/performance.py",
    "radsim/prompt_cache.py",
    "radsim/rate_limiter.py",
    "radsim/response_validator.py",
    "radsim/safety.py",
    "radsim/tool_router.py",
    "radsim/tool_schema.py",
    "radsim/tools/command_policy.py",
    "radsim/tools/validation.py",
]
pytest_add_cli_args = ["-p", "no:randomly", "--tb=short"]
pytest_add_cli_args_test_selection = ["tests"]
mutate_only_covered_lines = true
timeout_multiplier = 4.0
timeout_constant = 1.0
use_git_change_detection = true
